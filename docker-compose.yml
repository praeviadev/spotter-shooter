services:
  postgres:
    image: postgres:15-alpine
    container_name: spotter-postgres
    environment: {POSTGRES_DB: "${POSTGRES_DB:-spotter}", POSTGRES_USER: "${POSTGRES_USER:-spotter}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-spotter-local-dev}"}
    volumes: [spotter_postgres:/var/lib/postgresql/data, ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-spotter} -d $${POSTGRES_DB:-spotter}"], interval: 10s, timeout: 5s, retries: 10}
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    container_name: spotter-redis
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 10}
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: spotter-qdrant
    volumes: [spotter_qdrant:/qdrant/storage]
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: spotter-minio
    command: server /data --console-address ':9001'
    environment: {MINIO_ROOT_USER: "${MINIO_ROOT_USER:-spotter}", MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-spotter-minio-local}"}
    volumes: [spotter_minio:/data]
    restart: unless-stopped
  api:
    build: {context: ., dockerfile: api/Dockerfile}
    container_name: spotter-api
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}, qdrant: {condition: service_started}, minio: {condition: service_started}}
    restart: unless-stopped
  agents:
    build: {context: ., dockerfile: agents/Dockerfile}
    container_name: spotter-agents
    env_file: .env
    depends_on: {redis: {condition: service_healthy}}
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    container_name: spotter-caddy
    depends_on: [api]
    ports:
      - "127.0.0.1:8097:80"
    volumes: [./caddy/Caddyfile:/etc/caddy/Caddyfile:ro]
    restart: unless-stopped
volumes: {spotter_postgres: {}, spotter_qdrant: {}, spotter_minio: {}}
